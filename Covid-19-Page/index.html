<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
        integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
        integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN"
        crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"
        integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="boundary">

    <div class="top-card d-flex flex-row justify-content-between">
        <div class="d-flex flex-column">
            <h1 class="covid-heading">All you need to know about COVID-19</h1>
            <button class="top-button">Know more</button>
        </div>
        <img class="top-image" src="https://d2clawv67efefq.cloudfront.net/ccbp-static-website/medicalcare-img.png" />
    </div>

    <div class="cov-card d-flex flex-row justify-content-between">
        <img src="https://d2clawv67efefq.cloudfront.net/ccbp-static-website/coronavirus-img.png" class="cov" />
        <div>
            <h1 class="cov-heading">COVID-19 Test</h1>
            <p class="cov-para">If you think you have been exposed to novel coronavirus (COVID-19)...more</p>
        </div>
    </div>

    <div>
        <h1 class="syms-head">Symptoms</h1>
        <div class="d-flex flex-row justify-content-center">
            <div class="dry-card d-flex flex-column justify-content-center">
                <img src="https://d2clawv67efefq.cloudfront.net/ccbp-static-website/cough-img.png" class="dry-image" />
                <p class="dry-image-text">Dry Cough</p>
            </div>

            <div class="fever-card d-flex flex-column justify-content-center">
                <img src="https://d2clawv67efefq.cloudfront.net/ccbp-static-website/fever-img.png"
                    class="fever-image" />
                <p class="fever-image-text">High Fever</p>
            </div>

            <div class="head-card d-flex flex-column justify-content-center">
                <img src="https://d2clawv67efefq.cloudfront.net/ccbp-static-website/headache-img.png"
                    class="head-image" />
                <p class="head-image-text">Headache</p>
            </div>
        </div>
    </div>

    <div>
        <h1 class="videos-heading">Videos</h1>
        <div class="videos-card d-flex flex-row">
            <img src="https://d2clawv67efefq.cloudfront.net/ccbp-static-website/doctor-img.png" class="doc-image" />
            <div class="d-flex flex-column justify-content-end">
                <h1 class="prevent-heading">To prevent the spread of ...</h1>
                <p class="videos-para">If you think you have been exposed to novel corona virus (COVID-19)</p>
                <button class="bottom-button">Watch Video</button>
            </div>
        </div>
    </div>

</body>

</html>
