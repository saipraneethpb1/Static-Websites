<!DOCTYPE html>
<html>

<head>
    <title>Mobile Specifications</title>

    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="bg-container">

        <img src="https://d2clawv67efefq.cloudfront.net/ccbp-static-website/iphoneX-bg.png" class="mobile-image"
            alt="iphone image" />

        <div class="spec-card">
            <h1 class="heading">Specifications:</h1>

            <ul class="spec-list">
                <li>3 GB RAM</li>
                <li>5.80 Super Retina HD OLED Display</li>
                <li>Front Camera 7MP</li>
                <li>Rear Camera 12MP + 12MP</li>
                <li>Apple A11 Bionic Processor</li>
                <li>Battery Capacity 2716mAH</li>
            </ul>

            <div class="button-container">
                <button class="buy-btn">Buy Now</button>
            </div>
        </div>

    </div>

</body>

</html>
